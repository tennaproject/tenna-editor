name: Deploy to Cloudflare Pages (Pull Request)

on:
  workflow_dispatch:
    inputs:
      pull_request:
        description: Pull request number
        required: true
        type: number

concurrency:
  group: deploy-pr-preview-${{ inputs.pull_request }}
  cancel-in-progress: true

jobs:
  resolve:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      number: ${{ steps.pull-request.outputs.number }}
      repository: ${{ steps.pull-request.outputs.repository }}
      sha: ${{ steps.pull-request.outputs.sha }}

    steps:
      - name: resolve pull request
        id: pull-request
        uses: actions/github-script@v8
        with:
          script: |
            const number = Number(context.payload.inputs.pull_request);
            const { data: pull } = await github.rest.pulls.get({
              ...context.repo,
              pull_number: number,
            });

            if (pull.state !== 'open') {
              core.setFailed(`Pull request #${number} is not open.`);
              return;
            }

            core.setOutput('number', String(pull.number));
            core.setOutput('repository', pull.head.repo.full_name);
            core.setOutput('sha', pull.head.sha);

  build:
    needs: resolve
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      BRANCH: pr-${{ needs.resolve.outputs.number }}
      COMMIT_HASH: ${{ needs.resolve.outputs.sha }}

    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ needs.resolve.outputs.repository }}
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - run: bun install --frozen-lockfile
      - run: bun run check
        env:
          VITE_DEPLOY_TARGET: preview

      - name: upload preview
        uses: actions/upload-artifact@v4
        with:
          name: pr-preview
          path: dist
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: [resolve, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      pull-requests: write

    environment:
      name: pr-${{ needs.resolve.outputs.number }}
      url: ${{ steps.deploy.outputs['pages-deployment-alias-url'] }}

    env:
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_PROJECT: tenna
      BUILD_DIR: dist
      PR_NUMBER: ${{ needs.resolve.outputs.number }}
      PREVIEW_BRANCH: pr-${{ needs.resolve.outputs.number }}

    steps:
      - name: download preview
        uses: actions/download-artifact@v5
        with:
          name: pr-preview
          path: ${{ env.BUILD_DIR }}

      - name: deploy with wrangler
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ env.CF_API_TOKEN }}
          accountId: ${{ env.CF_ACCOUNT_ID }}
          command: >
            pages deploy ${{ env.BUILD_DIR }}
            --project-name=${{ env.CF_PROJECT }}
            --branch=${{ env.PREVIEW_BRANCH }}

      - name: report url
        uses: actions/github-script@v8
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs['pages-deployment-alias-url'] }}
        with:
          script: |
            const marker = '<!-- tenna-pr-preview -->';
            const issue_number = Number(process.env.PR_NUMBER);
            const body = [
              marker,
              '### PR preview',
              '',
              `Deployment: ${process.env.DEPLOYMENT_URL}`,
              '',
              '_Updated by a manually triggered workflow._',
            ].join('\n');

            const comments = await github.paginate(
              github.rest.issues.listComments,
              { ...context.repo, issue_number, per_page: 100 },
            );
            const existing = comments.find(
              (comment) =>
                comment.user?.type === 'Bot' && comment.body?.includes(marker),
            );

            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number,
                body,
              });
            }

      - name: write job summary
        run: |
          {
            echo '### PR preview'
            echo
            echo "Pull request: #${{ needs.resolve.outputs.number }}"
            echo
            echo "Deployment: ${{ steps.deploy.outputs['pages-deployment-alias-url'] }}"
          } >> "$GITHUB_STEP_SUMMARY"

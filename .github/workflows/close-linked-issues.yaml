name: Close linked issues

on:
  pull_request:
    types: [closed]

jobs:
  close:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: read
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const pr = context.payload.pull_request;

            const VERBS = {
              feature:  'Added',
              fix:      'Fixed',
              refactor: 'Changed',
              cleanup:  'Changed',
              chore:    'Changed',
              docs:     'Documented',
            };

            const prefix = pr.head.ref.split('/')[0].toLowerCase();
            const label = VERBS[prefix] || 'Changed';

            const NOISE = /^(wip|typo|fixup|squash|fix(es)? (typo|again)|merge branch|revert)/i;
            const commits = await github.paginate(
              github.rest.pulls.listCommits,
              { ...context.repo, pull_number: pr.number, per_page: 100 }
            );

            const kept = commits
              .map(c => ({ sha: c.sha.slice(0, 7), subject: c.commit.message.split('\n')[0].trim() }))
              .filter(c => !NOISE.test(c.subject));

            const list = kept.map(c => `- \`${c.sha}\` ${c.subject}`).join('\n');

            let block = '';
            if (kept.length === 0) {
              block = `Changes: ${pr.html_url}/files`;
            } else if (kept.length > 5) {
              block = `<details><summary>${kept.length} commits</summary>\n\n${list}\n\n</details>`;
            } else {
              block = `Commits:\n${list}`;
            }

            const body = [
              `**${label} in #${pr.number}**, merged into \`${pr.base.ref}\`.`,
              ``,
              block,
              ``,
              `Available now on the preview instance: https://preview.tennaproject.com`,
              `This will reach the main instance with the next update.`,
            ].join('\n');

            const refs = new Set(
              [...(pr.body || '').matchAll(/(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)/gi)]
                .map(m => Number(m[1]))
            );

            if (refs.size === 0) {
              core.info('No closing keywords found in PR body. Nothing to do.');
              return;
            }

            for (const issue_number of refs) {
              await github.rest.issues.createComment({ ...context.repo, issue_number, body });
              await github.rest.issues.update({
                ...context.repo, issue_number, state: 'closed', state_reason: 'completed',
              });
            }